# The container only listens on 443. docker-compose maps BOTH external
# ports (3080 and 8443) to 443 so any cached HSTS / Always-Use-HTTPS
# upgrade resolves to HTTPS instead of plain HTTP.

# Use Docker's embedded DNS for runtime upstream resolution so a
# frankenphp/reverb container restart doesn't leave nginx stuck on a
# stale IP. valid=10s means re-resolve every 10s.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- HTTPS ---
# HTTP/2 is intentionally OFF: nginx does not support the RFC 8441
# extended-CONNECT method needed to do WebSocket upgrades inside an
# HTTP/2 stream, so the browser tried wss://… over HTTP/2 and nginx
# 500'd every handshake. Plain HTTP/1.1 over TLS is fine for this app.
server {
  listen 443 ssl;
  server_name _;

  # Variables-based upstream forces runtime DNS resolution via the
  # `resolver` directive above (instead of resolve-once at config load).
  set $upstream_php    http://frankenphp:80;
  set $upstream_reverb http://reverb:8080;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json
             application/x-javascript text/xml application/xml
             application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1000;
  gzip_vary on;

  client_max_body_size 50M;

  # API proxy to frankenphp
  location /api/ {
    proxy_pass $upstream_php;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Sanctum CSRF cookie
  location /sanctum/ {
    proxy_pass $upstream_php;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  # Broadcasting auth (Reverb)
  location /broadcasting/ {
    proxy_pass $upstream_php;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Reverb pusher WebSocket (browser → wss → nginx → ws → reverb)
  location /app/ {
    proxy_pass $upstream_reverb;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location /apps/ {
    proxy_pass $upstream_reverb;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Hashed JS/CSS, cache forever
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
  }

  # Static assets, cache forever
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML entry point, never cache
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
