# The container only listens on 443. docker-compose maps BOTH external
# ports (3080 and 8443) to 443 so any cached HSTS / Always-Use-HTTPS
# upgrade resolves to HTTPS instead of plain HTTP.

# --- HTTPS ---
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json
             application/x-javascript text/xml application/xml
             application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1000;
  gzip_vary on;

  client_max_body_size 50M;

  # API proxy to frankenphp
  location /api/ {
    proxy_pass http://frankenphp:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # Sanctum CSRF cookie
  location /sanctum/ {
    proxy_pass http://frankenphp:80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  # Broadcasting auth (Reverb)
  location /broadcasting/ {
    proxy_pass http://frankenphp:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Reverb pusher WebSocket (browser → wss → nginx → ws → reverb)
  location /app/ {
    proxy_pass http://reverb:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
  }

  location /apps/ {
    proxy_pass http://reverb:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Hashed JS/CSS, cache forever
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
  }

  # Static assets, cache forever
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML entry point, never cache
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
